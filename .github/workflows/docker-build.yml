name: Build & Release SD-WebUI Image

# Replaces upstream's docker-build.yml: no DockerHub, no buildx, publishes the
# image to GHCR and as a split-zstd release asset (GH releases cap at 2GB/file).

on:
  workflow_dispatch:
  push:
    branches: [ "main" ]

permissions:
  contents: write
  packages: write

env:
  UBUNTU_VERSION: "22.04"
  PYTHON_VERSION: "3.10"
  PYTORCH_VERSION: "2.4.0"
  CUDA: "12.1.1-base"
  WEBUI_REF: "v1.10.1"

jobs:
  cuda:
    runs-on: ubuntu-latest
    timeout-minutes: 350
    steps:
      - name: Free disk space
        run: |
          sudo rm -rf /usr/share/dotnet /opt/ghc /usr/local/.ghcup \
            /usr/local/share/boost /usr/local/lib/android \
            "$AGENT_TOOLSDIRECTORY" /opt/hostedtoolcache/CodeQL
          docker image prune -af
          df -h /

      - uses: actions/checkout@v4

      - name: Resolve image name
        run: echo "IMAGE=ghcr.io/${GITHUB_REPOSITORY,,}" >> "$GITHUB_ENV"

      - name: Build
        run: |
          docker build \
            --build-arg IMAGE_BASE=ghcr.io/ai-dock/python:${PYTHON_VERSION}-v2-cuda-${CUDA}-${UBUNTU_VERSION} \
            --build-arg PYTHON_VERSION="${PYTHON_VERSION}" \
            --build-arg PYTORCH_VERSION="${PYTORCH_VERSION}" \
            --build-arg WEBUI_BUILD_REF="${WEBUI_REF}" \
            -t "${IMAGE}:v2-cuda-${CUDA}-${UBUNTU_VERSION}-${WEBUI_REF}" \
            -t "${IMAGE}:latest-cuda" \
            -t "${IMAGE}:latest" \
            -t "${IMAGE}:latest-jupyter" \
            build
          docker images

      - name: Push to GHCR
        run: |
          echo "${{ secrets.GITHUB_TOKEN }}" | docker login ghcr.io -u "${{ github.actor }}" --password-stdin
          docker push --all-tags "${IMAGE}"

      - name: Package image for release
        run: |
          command -v zstd >/dev/null || sudo apt-get install -y zstd
          # ponytail: pipe save straight into zstd then split, so no 10GB+ tar hits disk
          docker save "${IMAGE}:latest-jupyter" \
            | zstd -1 -T0 \
            | split -b 1800M - "sd-webui-${WEBUI_REF}-cuda-${CUDA}.tar.zst.part-"
          sha256sum sd-webui-*.part-* > SHA256SUMS
          ls -lh sd-webui-*.part-* SHA256SUMS

      - name: Publish release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          TAG="image-${WEBUI_REF}-cuda-${CUDA}"
          gh release delete "$TAG" --yes --cleanup-tag || true
          gh release create "$TAG" sd-webui-*.part-* SHA256SUMS \
            --title "SD-WebUI ${WEBUI_REF} — CUDA ${CUDA} (${UBUNTU_VERSION})" \
            --notes "Image: \`${IMAGE}\` (tags \`latest-jupyter\`, \`latest-cuda\`, \`latest\`, \`v2-cuda-${CUDA}-${UBUNTU_VERSION}-${WEBUI_REF}\`)

          Restore locally:

          \`\`\`bash
          cat sd-webui-*.tar.zst.part-* | zstd -d | docker load
          \`\`\`

          Verify parts first with \`sha256sum -c SHA256SUMS\`."
